name: 🌙 每日自動更新文言文睡眠篇章並發布網站

on:
  schedule:
    # 每天台灣時間 22:00 (UTC 14:00) 自動執行，電腦關機也能每天在雲端準時自動生成發布！
    - cron: '0 14 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵即時觸發更新

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下載專案代碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝 Edge-TTS 神經語音引擎
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: 🎙️ 執行每日新篇章自動生成
        run: |
          python scripts/daily_updater.py

      - name: 💾 提交並推送新篇章至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/episodes.json data/episodes.json data/upcoming_corpus.json web/audio/*.mp3 audio/*.mp3 || true
          if git diff --staged --quiet; then
            echo "今日無新篇章變更"
          else
            git commit -m "🌙 [Cloud Daily Auto-Update] 自動上線今日文言文睡眠篇章 ($(date +'%Y-%m-%d'))"
            git push origin main
          fi

      - name: 🌐 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 上傳 GitHub Pages 靜態網站產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: 🚀 自動部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
